services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jaga_warung
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jaga_warung"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      # Compose starts a broker + worker, so publish by default; host env wins.
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Container-to-container DB URL. Hardcoded on purpose: compose also reads
      # .env for interpolation, and that value points at localhost for `make run`.
      DATABASE_URL: host=db user=postgres password=postgres dbname=jaga_warung port=5432 sslmode=disable TimeZone=Asia/Jakarta
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # podman: privileged=false, no special caps needed
    # kafka is optional: no depends_on, API boots and publishes only when
    # KAFKA_BROKERS is set (publish failures are logged, never fatal).

  # Stock consumer. Needs the DB (it applies the sale's stock side effects) but
  # no API secrets: entrypoint overrides the image's default /api.
  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: jaga-warung-worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: host=db user=postgres password=postgres dbname=jaga_warung port=5432 sslmode=disable TimeZone=Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: docker.io/apache/kafka:4.3.0
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL = container-to-container, EXTERNAL = host (`make run`).
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Explicit: auto-created `jaga-warung.events` must be single-partition so
      # all events share one total order (transaction + its movements).
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  # One-shot: creates the topics explicitly. Broker auto-create proved unreliable
  # in the Kafka 4 image, and this pins partitions=1 regardless of defaults. The
  # DLQ is created up front so a failing rebuild never depends on auto-create.
  kafka-init:
    image: docker.io/apache/kafka:4.3.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1;
        do sleep 2; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
        --if-not-exists --topic jaga-warung.events --partitions 1 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
        --if-not-exists --topic jaga-warung.events.dlq --partitions 1 --replication-factor 1
    restart: "no"

volumes:
  pgdata:
